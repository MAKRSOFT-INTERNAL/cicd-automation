name: Docker

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nginx:
    name: Build and smoke test Nginx
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set short image tag
        id: image-tag
        run: echo "tag=$(git rev-parse --short=12 "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

      - name: Build Nginx image
        env:
          IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
        run: docker compose -f docker-compose.yml build

      - name: Package image
        env:
          IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
        run: |
          mkdir -p DockerImages
          docker save --output "DockerImages/nginx-${IMAGE_TAG}.tar" "cicd-automation-nginx:${IMAGE_TAG}"

      - name: Upload image package
        uses: actions/upload-artifact@v4
        with:
          name: nginx-image-${{ steps.image-tag.outputs.tag }}
          path: DockerImages/nginx-${{ steps.image-tag.outputs.tag }}.tar
          if-no-files-found: error
          retention-days: 7

      - name: Start Nginx
        env:
          IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
        run: docker compose -f docker-compose.yml up --detach

      - name: Check welcome page
        run: curl --fail --retry 10 --retry-all-errors --retry-delay 1 http://localhost:8080/ | grep --fixed-strings --quiet "Welcome to MAKRSOFT IT SOLUTIONS"

      - name: Stop Nginx
        if: always()
        run: docker compose -f docker-compose.yml down --remove-orphans

      - name: Commit image archive to branch
        if: github.ref_type == 'branch' && github.event_name != 'pull_request'
        env:
          IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "DockerImages/nginx-${IMAGE_TAG}.tar"
          if git diff --cached --quiet; then
            echo "Image archive is already committed."
            exit 0
          fi
          git commit -m "Update Nginx image archive [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"