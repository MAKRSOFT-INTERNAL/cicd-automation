name: Docker

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nginx:
    name: Build and smoke test Nginx
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Nginx image
        run: docker compose -f docker-compose.yml build

      - name: Package image
        run: |
          mkdir -p DockerImages
          docker save --output DockerImages/nginx.tar cicd-automation-nginx:latest

      - name: Upload image package
        uses: actions/upload-artifact@v4
        with:
          name: nginx-image-${{ github.sha }}
          path: DockerImages/nginx.tar
          if-no-files-found: error
          retention-days: 7

      - name: Start Nginx
        run: docker compose -f docker-compose.yml up --detach

      - name: Check welcome page
        run: curl --fail --retry 10 --retry-all-errors --retry-delay 1 http://localhost:8080/ | grep --fixed-strings --quiet "Welcome to MAKRSOFT IT SOLUTIONS"

      - name: Stop Nginx
        if: always()
        run: docker compose -f docker-compose.yml down --remove-orphans