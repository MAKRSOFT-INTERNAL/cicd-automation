name: Docker on self-hosted runner

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, test, and clean up Nginx
    runs-on: [self-hosted, linux, x64, docker-nginx]
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare image tag and log path
        id: meta
        run: |
          echo "tag=$(git rev-parse --short=12 "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
          echo "log=runner-logs/build-${GITHUB_RUN_ID}.log" >> "$GITHUB_OUTPUT"
          mkdir -p runner-logs DockerImages

      - name: Build and package image
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
          BUILD_LOG: ${{ steps.meta.outputs.log }}
        run: |
          set -o pipefail
          docker compose -f docker-compose.yml build 2>&1 | tee -a "$BUILD_LOG"
          docker save --output "DockerImages/nginx-${IMAGE_TAG}.tar" "cicd-automation-nginx:${IMAGE_TAG}" 2>&1 | tee -a "$BUILD_LOG"

      - name: Start Nginx
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
          BUILD_LOG: ${{ steps.meta.outputs.log }}
        run: docker compose -f docker-compose.yml up --detach 2>&1 | tee -a "$BUILD_LOG"

      - name: Check welcome page
        env:
          BUILD_LOG: ${{ steps.meta.outputs.log }}
        run: |
          set -o pipefail
          curl --silent --show-error --fail --retry 10 --retry-all-errors --retry-delay 1 --output "$RUNNER_TEMP/nginx-response.html" http://host.docker.internal:8080/ 2>&1 | tee -a "$BUILD_LOG"
          cat "$RUNNER_TEMP/nginx-response.html" | tee -a "$BUILD_LOG"
          grep --fixed-strings --quiet "Welcome to MAKRSOFT IT SOLUTIONS" "$RUNNER_TEMP/nginx-response.html"

      - name: Capture Nginx logs and stop/remove container
        if: always()
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
          BUILD_LOG: ${{ steps.meta.outputs.log }}
        run: |
          docker compose -f docker-compose.yml logs --no-color nginx >> "$BUILD_LOG" 2>&1 || true
          docker compose -f docker-compose.yml down --remove-orphans --timeout 10 >> "$BUILD_LOG" 2>&1 || true

      - name: Upload image archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nginx-image-${{ steps.meta.outputs.tag }}
          path: DockerImages/nginx-${{ steps.meta.outputs.tag }}.tar
          if-no-files-found: error
          retention-days: 7

      - name: Upload build and container logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nginx-build-logs-${{ github.run_id }}
          path: runner-logs/*.log
          if-no-files-found: warn
          retention-days: 30