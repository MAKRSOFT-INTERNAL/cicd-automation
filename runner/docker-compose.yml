services:
  runner:
    image: myoung34/github-runner:latest
    container_name: makrsoft-docker-runner
    restart: "no"
    environment:
      REPO_URL: ${REPO_URL:?Set REPO_URL in runner/.env}
      RUNNER_TOKEN: ${RUNNER_TOKEN:?Set RUNNER_TOKEN in runner/.env}
      RUNNER_SCOPE: repo
      RUNNER_NAME: makrsoft-docker-runner
      RUNNER_WORKDIR: /_work
      LABELS: docker-nginx
      EPHEMERAL: "true"
      RUN_AS_ROOT: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock