<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#102b3f">
    <title>MAKRSOFT IT SOLUTIONS</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        background: #e8f0ed;
        color: #102b3f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(ellipse at 12% 18%, #d2e7dd 0, transparent 34%),
          linear-gradient(140deg, #f8f6ec, #e1ece9 58%, #d9e8ef);
      }

      main {
        width: min(100%, 880px);
        padding: clamp(32px, 8vw, 88px);
        border-top: 6px solid #e06b43;
        background: rgba(255, 255, 255, 0.78);
        box-shadow: 0 24px 70px rgba(16, 43, 63, 0.12);
        text-align: center;
      }

      p {
        margin: 0 0 18px;
        color: #287c72;
        font-size: 0.82rem;
        font-weight: 700;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 7vw, 4.5rem);
        line-height: 1.08;
        overflow-wrap: anywhere;
      }

      @media (max-width: 480px) {
        main {
          padding: 36px 24px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p>Server is online</p>
      <h1>Welcome to MAKRSOFT IT SOLUTIONS</h1>
    </main>
  </body>
</html>
